<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1b2a4a" />
  <title>Города — игра с друзьями</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <a href="/" class="brand-link">
          <span class="logo">🏙️</span>
          <h1>Города</h1>
        </a>
      </div>
      <div class="controls">
        <span id="connStatus" class="conn" title="Статус подключения">…</span>
      </div>
    </header>

    <!-- Экран лобби -->
    <section id="lobbyScreen" class="screen">
      <div class="card">
        <h2 class="card-title">Ваше имя</h2>
        <input id="nameInput" class="text-input" type="text" maxlength="24"
               placeholder="Как вас называть" autocomplete="nickname" />
      </div>

      <div class="card">
        <h2 class="card-title">Создать комнату</h2>
        <div class="field-row">
          <label class="field">
            <span class="field-label">Игроков</span>
            <select id="maxPlayers" class="text-input">
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4" selected>4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="8">8</option>
            </select>
          </label>
          <label class="field">
            <span class="field-label">Таймер (сек)</span>
            <select id="turnTimer" class="text-input">
              <option value="0">Без лимита</option>
              <option value="30">30 сек</option>
              <option value="60" selected>60 сек</option>
              <option value="90">90 сек</option>
              <option value="120">2 мин</option>
            </select>
          </label>
          <label class="field">
            <span class="field-label">Партий</span>
            <select id="totalRounds" class="text-input">
              <option value="1" selected>1 (до победы)</option>
              <option value="3">До 2 из 3</option>
              <option value="5">До 3 из 5</option>
              <option value="7">До 4 из 7</option>
              <option value="9">До 5 из 9</option>
            </select>
          </label>
        </div>
        <div class="field-row">
          <label class="field check">
            <input id="hintsCheck" type="checkbox" checked />
            <span>Подсказки</span>
          </label>
          <label class="field check">
            <input id="isPrivate" type="checkbox" />
            <span>Закрытая</span>
          </label>
        </div>
        <div class="field-row">
          <label class="field">
            <span class="field-label">Ожидание дисконнекта</span>
            <select id="disconnectTimeout" class="text-input">
              <option value="0">Бесконечно</option>
              <option value="60">1 мин</option>
              <option value="120">2 мин</option>
              <option value="300" selected>5 мин</option>
              <option value="600">10 мин</option>
            </select>
          </label>
        </div>
        <input id="passwordInput" class="text-input" type="text"
               placeholder="Пароль (только для закрытой)" disabled />
        <button id="createBtn" class="btn btn-primary btn-block">Создать комнату</button>
      </div>

      <div class="card">
        <div class="card-title-row">
          <h2 class="card-title">Открытые игры</h2>
          <button id="refreshBtn" class="btn btn-ghost" type="button" title="Обновить">↻</button>
        </div>
        <div id="roomsList" class="rooms-list"></div>
        <div class="join-by-code">
          <input id="codeInput" class="text-input" type="text" placeholder="Код комнаты"
                 maxlength="8" autocapitalize="characters" />
          <input id="codePassword" class="text-input" type="text" placeholder="Пароль (если есть)" />
          <button id="joinByCodeBtn" class="btn">Подключиться</button>
        </div>
      </div>

      <div id="lobbyMsg" class="message"></div>
    </section>

    <!-- Экран комнаты -->
    <section id="roomScreen" class="screen hidden">
      <div class="room-head">
        <div class="room-meta">
          <div class="room-code">Код <b id="roomCode">—</b></div>
          <div id="roundInfo" class="room-status hidden"></div>
          <div id="roomStatus" class="room-status">Ожидание</div>
        </div>
        <div class="room-actions">
          <button id="shareBtn" class="btn" title="Поделиться ссылкой">📋 Ссылка</button>
          <button id="startBtn" class="btn btn-primary hidden">Начать</button>
          <button id="nextRoundBtn" class="btn btn-primary hidden">▶️ Следующая партия</button>
          <button id="rematchBtn" class="btn btn-primary hidden">🔄 Новая серия</button>
          <button id="surrenderBtn" class="btn hidden">Сдаться</button>
          <button id="leaveBtn" class="btn">Выйти</button>
        </div>
      </div>

      <div class="room-status-card">
        <div>
          <span class="label">Ход — город на букву</span>
          <span id="mpLetter" class="next-letter">—</span>
        </div>
        <div id="timerDisplay" class="timer-display hidden">--</div>
        <div id="turnIndicator" class="turn-indicator">—</div>
      </div>

      <div id="playersList" class="players-list"></div>

      <main id="mpFeed" class="feed" aria-live="polite"></main>

      <footer class="composer">
        <form id="mpForm" class="input-row" autocomplete="off">
          <input id="mpInput" name="city" type="text" placeholder="Введите город…"
                 autocomplete="off" autocorrect="off" autocapitalize="words"
                 spellcheck="false" inputmode="text" enterkeyhint="send" disabled />
          <button id="hintBtn" class="btn hidden" type="button" title="Подсказка">💡</button>
          <button id="mpSendBtn" class="btn btn-primary" type="submit" disabled>Ход</button>
        </form>
        <div id="mpMessage" class="message"></div>
      </footer>

      <!-- Эмодзи-реакции -->
      <div class="emoji-bar">
        <button class="emoji-btn" data-emoji="👍">👍</button>
        <button class="emoji-btn" data-emoji="🔥">🔥</button>
        <button class="emoji-btn" data-emoji="😂">😂</button>
        <button class="emoji-btn" data-emoji="😮">😮</button>
        <button class="emoji-btn" data-emoji="👏">👏</button>
        <button class="emoji-btn" data-emoji="💀">💀</button>
      </div>

      <!-- Чат -->
      <div class="chat-section">
        <div class="chat-header" id="chatToggle">
          <span>💬 Чат</span>
          <span id="chatBadge" class="chat-badge hidden">0</span>
          <span id="chatArrow" class="chat-arrow">▼</span>
        </div>
        <div id="chatBody" class="chat-body hidden">
          <div id="chatMessages" class="chat-messages"></div>
          <form id="chatForm" class="chat-input-row" autocomplete="off">
            <input id="chatInput" type="text" placeholder="Сообщение…"
                   maxlength="200" autocomplete="off" />
            <button class="btn btn-primary" type="submit">↑</button>
          </form>
        </div>
      </div>

      <!-- Всплывающие эмодзи -->
      <div id="emojiFloats" class="emoji-floats"></div>
    </section>
  </div>

  <script src="multi.js"></script>
</body>
</html>
