<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1b2a4a" />
  <title>Города — игра с друзьями</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="manifest.json" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <a href="/" class="brand-link">
          <span class="logo">🏙️</span>
          <h1>Города</h1>
        </a>
      </div>
      <div class="controls">
        <button id="profileBtn" class="conn-btn" title="Профиль">
          <span id="myAvatar">🙂</span>
        </button>
        <button id="themeBtn" class="conn-btn" title="Тема">🌙</button>
        <button id="soundBtn" class="conn-btn" title="Звук">🔊</button>
        <span id="connStatus" class="conn" title="Статус подключения">…</span>
      </div>
    </header>

    <!-- Профиль modal -->
    <div id="profileModal" class="modal-overlay hidden">
      <div class="modal">
        <h3>Профиль</h3>
        <div class="profile-preview">
          <div id="avatarPreview" class="avatar-big">🙂</div>
          <div class="profile-name" id="profileNamePreview">Игрок</div>
        </div>
        <label class="field">
          <span class="field-label">Имя</span>
          <input id="profileName" class="text-input" type="text" maxlength="24" placeholder="Ваше имя" />
        </label>
        <div class="field">
          <span class="field-label">Аватар</span>
          <div id="avatarPicker" class="avatar-picker"></div>
        </div>
        <div class="field">
          <span class="field-label">Цвет</span>
          <div id="colorPicker" class="color-picker"></div>
        </div>
        <div class="profile-auth">
          <button id="googleLoginBtn" class="btn btn-google">Войти через Google</button>
          <span id="googleStatus" class="muted" style="font-size:12px"></span>
        </div>
        <div class="field-row">
          <button id="profileSave" class="btn btn-primary btn-block">Сохранить</button>
          <button id="profileCancel" class="btn">Отмена</button>
        </div>
      </div>
    </div>

    <!-- Экран лобби -->
    <section id="lobbyScreen" class="screen">
      <div class="card welcome-card">
        <div class="welcome-text">
          <h2 id="welcomeHi">Привет, Игрок!</h2>
          <p class="muted">Создайте комнату или подключитесь к игре друзей</p>
        </div>
        <button id="editProfileBtn" class="btn">✏️ Изменить профиль</button>
      </div>

      <div class="card">
        <h2 class="card-title">Создать комнату</h2>
        <div class="field-row">
          <label class="field">
            <span class="field-label">Игроков (2–32)</span>
            <input id="maxPlayers" class="text-input" type="number" min="2" max="32" value="4" />
          </label>
          <label class="field">
            <span class="field-label">Таймер (сек)</span>
            <select id="turnTimer" class="text-input">
              <option value="0">Без лимита</option>
              <option value="30">30 сек</option>
              <option value="60" selected>60 сек</option>
              <option value="90">90 сек</option>
              <option value="120">2 мин</option>
            </select>
          </label>
        </div>
        <div class="field-row">
          <label class="field check">
            <input id="hintsCheck" type="checkbox" checked />
            <span>Подсказки</span>
          </label>
          <label class="field check">
            <input id="isPrivate" type="checkbox" />
            <span>Закрытая</span>
          </label>
        </div>
        <input id="passwordInput" class="text-input" type="text"
               placeholder="Пароль (только для закрытой)" disabled />
        <button id="createBtn" class="btn btn-primary btn-block">🚀 Создать комнату</button>
      </div>

      <div class="card">
        <div class="card-title-row">
          <h2 class="card-title">Открытые игры</h2>
          <button id="refreshBtn" class="btn btn-ghost" type="button" title="Обновить">↻</button>
        </div>
        <div id="roomsList" class="rooms-list"></div>
        <div class="join-by-code">
          <input id="codeInput" class="text-input" type="text" placeholder="Код комнаты"
                 maxlength="8" autocapitalize="characters" />
          <input id="codePassword" class="text-input" type="text" placeholder="Пароль (если есть)" />
          <button id="joinByCodeBtn" class="btn">Войти</button>
        </div>
      </div>

      <div id="lobbyMsg" class="message"></div>
    </section>

    <!-- Экран комнаты -->
    <section id="roomScreen" class="screen hidden">
      <div class="room-head">
        <div class="room-meta">
          <div class="room-code">🎮 <b id="roomCode">—</b></div>
          <div id="roomStatus" class="room-status">Ожидание</div>
        </div>
        <div class="room-actions">
          <button id="shareBtn" class="btn" title="Поделиться ссылкой">📋</button>
          <button id="startBtn" class="btn btn-primary hidden">Начать</button>
          <button id="extendBtn" class="btn hidden">+1 мин</button>
          <button id="rematchBtn" class="btn btn-primary hidden">🔄</button>
          <button id="surrenderBtn" class="btn hidden">🏳️</button>
          <button id="leaveBtn" class="btn">🚪</button>
        </div>
      </div>

      <!-- Автостарт -->
      <div id="autoStartBar" class="autostart-bar hidden">
        <span class="autostart-icon">⏱</span>
        <span>Игра начнётся через <b id="autoStartTime">--</b></span>
      </div>

      <!-- Status & Timer -->
      <div class="room-status-card">
        <div class="letter-big">
          <span class="label">Следующая буква</span>
          <span id="mpLetter" class="next-letter">—</span>
        </div>
        <div id="timerDisplay" class="timer-display hidden">--</div>
        <div id="turnIndicator" class="turn-indicator">—</div>
      </div>

      <div id="playersList" class="players-list"></div>

      <main id="mpFeed" class="feed" aria-live="polite"></main>

      <footer class="composer">
        <form id="mpForm" class="input-row" autocomplete="off">
          <input id="mpInput" name="city" type="text" placeholder="Введите город…"
                 autocomplete="off" autocorrect="off" autocapitalize="words"
                 spellcheck="false" inputmode="text" enterkeyhint="send" disabled />
          <button id="hintBtn" class="btn hidden" type="button" title="Подсказка">💡</button>
          <button id="mpSendBtn" class="btn btn-primary" type="submit" disabled>Ход</button>
        </form>
        <div id="mpMessage" class="message"></div>
      </footer>

      <!-- Эмодзи -->
      <div class="emoji-bar">
        <button class="emoji-btn" data-emoji="👍">👍</button>
        <button class="emoji-btn" data-emoji="🔥">🔥</button>
        <button class="emoji-btn" data-emoji="😂">😂</button>
        <button class="emoji-btn" data-emoji="😮">😮</button>
        <button class="emoji-btn" data-emoji="👏">👏</button>
        <button class="emoji-btn" data-emoji="💀">💀</button>
        <button class="emoji-btn" data-emoji="🤔">🤔</button>
        <button class="emoji-btn" data-emoji="❤️">❤️</button>
      </div>

      <!-- Чат -->
      <div class="chat-section">
        <div class="chat-header" id="chatToggle">
          <span>💬 Чат</span>
          <span id="chatBadge" class="chat-badge hidden">0</span>
          <span id="chatArrow" class="chat-arrow">▼</span>
        </div>
        <div id="chatBody" class="chat-body hidden">
          <div id="chatMessages" class="chat-messages"></div>
          <div id="chatTyping" class="chat-typing hidden"></div>
          <form id="chatForm" class="chat-input-row" autocomplete="off">
            <button id="voiceBtn" class="btn chat-media-btn" type="button" title="Голосовое">🎤</button>
            <button id="videoBtn" class="btn chat-media-btn" type="button" title="Кружок">🎥</button>
            <input id="chatInput" type="text" placeholder="Сообщение…"
                   maxlength="500" autocomplete="off" />
            <button class="btn btn-primary chat-send-btn" type="submit">↑</button>
          </form>
          <!-- Voice recording UI -->
          <div id="recordingBar" class="recording-bar hidden">
            <span class="recording-dot"></span>
            <span id="recordingTime">0:00</span>
            <span class="recording-label" id="recordingLabel">Запись голоса…</span>
            <button id="recordCancel" class="btn">Отмена</button>
            <button id="recordSend" class="btn btn-primary">Отправить</button>
          </div>
          <!-- Video preview -->
          <div id="videoPreviewBar" class="video-preview-bar hidden">
            <video id="videoPreview" muted autoplay playsinline></video>
            <span id="videoRecTime">0:00</span>
            <button id="videoCancel" class="btn">Отмена</button>
            <button id="videoSend" class="btn btn-primary">Отправить</button>
          </div>
        </div>
      </div>

      <div id="emojiFloats" class="emoji-floats"></div>
    </section>
  </div>

  <input id="nameInput" type="hidden" value="" />

  <script src="multi.js"></script>
</body>
</html>
